# CI for telemetry-resilience: unit tests run against the clean source tree
# first, then the wheel/sdist are built in a separate temporary working
# copy and the installed CLI is smoke-tested. Build debris must never be
# created inside the checkout before pytest runs, because
# test_handoff_tree_has_no_generated_build_debris asserts a clean tree.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # Use bash on every OS so globs and quoting behave the same everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Packaging diagnostics: printed before the packaging tests so a
      # backend failure can be traced to the exact toolchain versions.
      # (Keep concise: one line per tool. Probes are informational only and
      # must not fail the job: e.g. `packaging` is not importable on some
      # runners even though pip works fine.)
      - name: Packaging toolchain diagnostics
        run: |
          python --version
          python -m pip --version
          python -c "import setuptools; print('setuptools', setuptools.__version__)" 2>/dev/null || echo "setuptools: not installed"
          python -c "import packaging; print('packaging', packaging.__version__)" 2>/dev/null || echo "packaging: not installed"
          python -c "import wheel; print('wheel', wheel.__version__)" 2>/dev/null || echo "wheel: not installed"
          pip install -q build
          python -c "import build; print('build', build.__version__)"

      # Install test dependencies from a pristine temp copy of the commit.
      # Installing from the checkout itself would leave build/ and
      # src/*.egg-info behind and break the clean-tree hygiene test below.
      - name: Install test dependencies (checkout stays clean)
        run: |
          TEST_SRC="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TEST_SRC"
          pip install "$TEST_SRC[test]"
          rm -rf "$TEST_SRC"

      - name: Unit tests (clean source tree)
        run: python -m pytest -q

      # The release/hygiene tests must also pass on their own, independent
      # of the rest of the suite's ordering or side effects.
      - name: Packaging tests, standalone
        run: python -m pytest tests/test_run42_packaging.py -q

      # All packaging work happens in a separate working copy so the
      # checkout that pytest observed stays pristine.
      - name: Build wheel and sdist (separate working copy)
        run: |
          BUILD_SRC="$(mktemp -d)"
          git archive HEAD | tar -x -C "$BUILD_SRC"
          cd "$BUILD_SRC"
          python -m build
          echo "BUILD_SRC=$BUILD_SRC" >> "$GITHUB_ENV"

      - name: Install the built wheel (not the source tree)
        run: |
          WHEELS=("$BUILD_SRC"/dist/*.whl)
          pip install "${WHEELS[0]}"

      - name: Doctor
        run: telemetry-resilience doctor

      - name: CLI smoke tests
        run: |
          cd "$BUILD_SRC"
          telemetry-resilience --version
          mkdir -p ci-smoke && cd ci-smoke
          # Small synthetic dataset + fixtures (no network anywhere).
          telemetry-resilience demo generate smoke.parquet --seconds 4 --hz 2
          telemetry-resilience inspect smoke.parquet
          cat > scenario.yaml <<'EOF'
          version: 1
          seed: 7
          input:
            file: smoke.parquet
            time_column: timestamp
          faults:
            - channel: pressure
              type: noise
              start: 1s
              duration: 2s
              std: 0.5
          EOF
          telemetry-resilience inject smoke.parquet --scenario scenario.yaml
          cat > suite.yaml <<'EOF'
          version: 1
          name: ci-suite
          input:
            file: smoke.parquet
            time_column: timestamp
          timeout_seconds: 60
          baseline:
            enabled: false
          cases:
            - name: pressure-noise
              seed: 11
              faults:
                - channel: pressure
                  type: noise
                  start: 1s
                  duration: 2s
                  std: 0.5
              expect:
                exit_code: 0
          EOF
          cat > campaign.yaml <<'EOF'
          version: 1
          name: ci-campaign
          seed: 5000
          input:
            file: smoke.parquet
            time_column: timestamp
          timeout_seconds: 60
          window:
            start: 1s
            duration: 2s
          baseline:
            enabled: false
          expect:
            exit_code: 0
          channels:
            pressure:
              noise:
                std: [0.5]
          EOF
          TARGET=(python -c "print('ci target ran')" "{data}")
          telemetry-resilience test scenario.yaml -- "${TARGET[@]}"
          telemetry-resilience suite suite.yaml --dry-run -- "${TARGET[@]}"
          telemetry-resilience suite suite.yaml --artifacts suite-artifacts -- "${TARGET[@]}"
          telemetry-resilience campaign campaign.yaml --plan
          telemetry-resilience campaign campaign.yaml --list-cases
          telemetry-resilience campaign campaign.yaml --artifacts campaign-artifacts -- "${TARGET[@]}"
          test -f campaign-artifacts/coverage.json
          test -f campaign-artifacts/summary.json
          test -f campaign-artifacts/junit.xml

      # The workflow must not create build debris in the checkout: fail if
      # build/, *.egg-info or dist/ show up in git status.
      - name: Verify checkout has no build debris
        run: |
          git status --short
          if git status --short | grep -Eq 'build/|egg-info|dist/'; then
            echo "ERROR: unexpected build debris in the checkout"
            exit 1
          fi
          echo "checkout clean: no build debris"
